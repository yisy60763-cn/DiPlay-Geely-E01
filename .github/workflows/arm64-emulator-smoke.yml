name: ARM64 Android emulator smoke test

on:
  push:
    branches: [wired-only-e01]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arm64-emulator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install-launch:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 emulator system-images;android-35;google_apis;arm64-v8a
      - uses: gradle/actions/setup-gradle@v4
      - name: Build source-only debug APK
        run: ./gradlew --no-configuration-cache :mobile:assembleDebug --stacktrace
      - name: Install and launch on ARM64 Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: arm64-v8a
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: |
            set -euo pipefail
            adb wait-for-device
            until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do sleep 2; done
            adb install -r mobile/build/outputs/apk/debug/mobile-debug.apk
            adb shell monkey -p com.shihab.diplay -c android.intent.category.LAUNCHER 1
            for attempt in $(seq 1 30); do
              if adb shell pidof com.shihab.diplay >/dev/null 2>&1; then break; fi
              sleep 2
            done
            if ! adb shell pidof com.shihab.diplay >/dev/null 2>&1; then
              adb logcat -d -t 4000
              echo "DiPlay process did not remain alive after launch."
              exit 1
            fi
            sleep 8
            if adb logcat -d -t 5000 | grep -E "FATAL EXCEPTION|Fatal signal|UnsatisfiedLinkError" | grep -q "com.shihab.diplay\|Fatal signal\|UnsatisfiedLinkError"; then
              adb logcat -d -t 5000
              echo "Fatal application/native error detected."
              exit 1
            fi
            echo "ARM64 emulator install and launch smoke test passed."
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" || true
      - name: Upload emulator log on failure
        if: failure()
        run: |
          mkdir -p emulator-diagnostics
          adb logcat -d -t 10000 > emulator-diagnostics/logcat.txt || true
          adb shell dumpsys activity > emulator-diagnostics/activity.txt || true
          adb shell dumpsys package com.shihab.diplay > emulator-diagnostics/package.txt || true
      - name: Publish emulator diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-emulator-diagnostics
          path: emulator-diagnostics/
          if-no-files-found: ignore
          retention-days: 7
