name: Android checks
on:
  push:
    branches: [main, geekplay-e01-improve, wired-only-e01]
  workflow_dispatch:

# New commits supersede older checks on the same branch. This prevents a queue
# of obsolete builds from delaying the APK for the current source tree.
concurrency:
  group: android-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;25.2.9519653

      - uses: gradle/actions/setup-gradle@v4

      - name: Build source-only debug APK (prioritize delivery)
        run: ./gradlew :mobile:assembleDebug --stacktrace

      - name: Upload source-only debug APK (compile check only; not for vehicle installation)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: source-only-debug-apk-not-for-install
          path: mobile/build/outputs/apk/debug/mobile-debug.apk
          if-no-files-found: error
          retention-days: 7
